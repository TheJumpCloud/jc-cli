name: Test

# The Go build/test gate for every PR. Before this workflow, no CI ran
# `go test` at all — the suite (~350 tests incl. the classification,
# schema-drift, and docs/solutions frontmatter lints) only ran on
# contributors' machines, and every green checkmark on a PR came from
# linting/labels/security scanning. Caught during the KLA-464 arc.


# A base-branch change fires `edited`, and nothing else. When a stacked PR's
# parent merges, GitHub retargets the child automatically — which changes the
# PR but creates no commit, so none of opened/synchronize/reopened fire and
# required checks sit in "Expected — waiting for status to be reported"
# forever, blocking a merge on a run that will never start. Recovering it
# meant closing and reopening the PR by hand, which happened four times in
# one afternoon during the KLA-485 merge queue.
#
# `edited` also fires on title and body edits, which is not worth a test run,
# so the job guards on github.event.changes.base — present only when the base
# actually moved.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip a title/body edit; run when the base branch changed.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # Thirty-four files had drifted out of gofmt before this gate existed,
        # which made every PR's diff carry formatting noise from files it had
        # not meaningfully touched — and twice nearly let an unrelated file
        # into a commit. Cheap to check, tedious to clean up in bulk.
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

      - name: go build (all platforms compile)
        run: |
          GOOS=darwin  GOARCH=arm64 go build ./cmd/jc
          GOOS=linux   GOARCH=amd64 go build ./cmd/jc
          GOOS=windows GOARCH=amd64 go build ./cmd/jc
